name: Release

on:
  push:
    tags: ['v0.29-nextor.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install pasmo
        run: sudo apt-get update && sudo apt-get install -y pasmo

      - name: Install openMSX 21.0
        run: |
          curl -fsSL -o openmsx.zip https://github.com/openMSX/openMSX/releases/download/RELEASE_21_0/openmsx-21.0-linux-x86_64-bin.zip
          echo "53cc1e9dc3a97b0ff56d1a1572b3ffdbba4fcaee3eb78c4391b9b1443f92284a  openmsx.zip" | sha256sum -c -
          mkdir -p "$HOME/openmsx" && unzip -q openmsx.zip -d "$HOME/openmsx"
          echo "$HOME/openmsx/bin" >> "$GITHUB_PATH"
          # The portable build has no compiled-in data directory: without this
          # it looks for share/ in /share and dies on the first unicodemap.
          echo "OPENMSX_SYSTEM_DATA=$HOME/openmsx/share" >> "$GITHUB_ENV"

      - name: Build and test
        run: make && make test

      - name: Assemble the assets
        run: make release-assets TAG="$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "C-BIOS 0.29 for Nextor ($GITHUB_REF_NAME)" \
            --notes-file derived/release/NOTES.md \
            derived/release/*.rom derived/release/SHA1SUMS derived/release/C-BIOS_MSX2_Nextor.xml
